<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Limud">
<meta name="theme-color" content="#F3F1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1416" media="(prefers-color-scheme: dark)">
<meta name="description" content="Shas Mishnah in a year: a daily plan for all 4,192 mishnayot.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Limud: Shas Mishnah in a Year</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#F3F1EA; --surface:#FFFFFF; --surface2:#F7F5EF; --line:#E3DED2; --line2:#D3CDBE;
  --ink:#1E1A1C; --muted:#6B6466; --faint:#9A9294;
  --gold:#946B17; --gold-soft:#F4E9CC; --on-gold:#FFFFFF; --accent:#2E7454; --accent-soft:#E2EFE7;
  --done:#2F8A5B; --partial:#C48A1C; --missed:#B9483F; --late:#F1DCD7; --future:#E9E6DD;
  --off1:#ECE9E0; --off2:#D6D1C4;
  --spine1:#23402F; --spine2:#2D5039; --shelf:#B9A57C; --foil1:#E8CB7E; --foil2:#B88A2E;
  --shadow:0 1px 2px rgba(30,26,28,.05),0 4px 14px rgba(30,26,28,.04);
  --serif:"Frank Ruhl Libre","Times New Roman",Georgia,serif;
  --sans:"Assistant",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --rs:1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#1A1416; --surface:#241C1F; --surface2:#2D2427; --line:#3B3034; --line2:#4A3E43;
    --ink:#F1EADF; --muted:#ADA19A; --faint:#7E7370;
    --gold:#D6B160; --gold-soft:#3A2F1E; --on-gold:#1A1416; --accent:#6DB088; --accent-soft:#1F3328;
    --done:#5FA37C; --partial:#D9A441; --missed:#D0675D; --late:#4A2E2E; --future:#2D2427;
    --off1:#2A2225; --off2:#51454A; --shelf:#5A4632; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#1A1416; --surface:#241C1F; --surface2:#2D2427; --line:#3B3034; --line2:#4A3E43;
  --ink:#F1EADF; --muted:#ADA19A; --faint:#7E7370;
  --gold:#D6B160; --gold-soft:#3A2F1E; --on-gold:#1A1416; --accent:#6DB088; --accent-soft:#1F3328;
  --done:#5FA37C; --partial:#D9A441; --missed:#D0675D; --late:#4A2E2E; --future:#2D2427;
  --off1:#2A2225; --off2:#51454A; --shelf:#5A4632; --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:17px;line-height:1.45;min-height:100vh;-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top,0px) 0 calc(84px + env(safe-area-inset-bottom,0px));overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
input,select,textarea{font-size:16px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
a{color:inherit}
h1,h2,h3{margin:0;font-weight:700}
.wrap{max-width:560px;margin:0 auto;padding:10px 16px 24px}
.screen{display:none}
.screen.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.he{font-family:var(--serif);direction:rtl;unicode-bidi:isolate}
.muted{color:var(--muted)}
.small{font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.h2{font-family:var(--serif);font-size:28px;letter-spacing:.2px}
.sec{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 2px 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.pad{padding:14px 16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.linkish{background:none;border:0;padding:4px 0;color:var(--gold);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.bar.ok i{background:var(--done)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);
  border-radius:14px;padding:12px 14px;font-weight:700;font-size:16px;min-height:48px;transition:transform .08s ease,background .15s ease}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.isdone{background:var(--done);border-color:var(--done);color:#fff}
.btn.ismissed{background:var(--missed);border-color:var(--missed);color:#fff}
.btn.wide{display:flex;width:100%}
.btn.big{font-size:18px;min-height:56px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--missed)}
.btn[disabled]{opacity:.45}

/* top of Today */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:8px 2px 0}
.top .hd{font-family:var(--serif);font-size:15px;color:var(--gold);direction:rtl;unicode-bidi:isolate}
.top .date{font-family:var(--serif);font-size:26px;line-height:1.15}
.top .dayno{font-size:14px;color:var(--muted);white-space:nowrap;text-align:right}
.top .dayno b{display:block;font-size:20px;color:var(--ink)}
.ded{color:var(--gold);font-size:17px;margin:4px 2px 0;text-align:right}
.overall{display:flex;align-items:center;gap:10px;margin:12px 2px 0;font-size:14px;color:var(--muted)}
.overall .bar{flex:1}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0 4px}
.wd{border:0;background:none;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.wd .c{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--ink);background:var(--future)}
.wd.done .c{background:var(--done);color:#fff}
.wd.partial .c{background:var(--partial);color:#fff}
.wd.missed .c{background:var(--missed);color:#fff}
.wd.late .c{background:var(--late)}
.wd.off .c{background:repeating-linear-gradient(135deg,var(--off1) 0 4px,var(--off2) 4px 8px);color:var(--muted)}
.wd.out .c{background:transparent;color:var(--faint)}
.wd.today .c{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.wd.today{color:var(--ink);font-weight:700}

/* learning card */
.leaf{margin:14px 0 12px;overflow:hidden}
.band{background:var(--gold-soft);color:var(--gold);padding:10px 16px;text-align:right;font-family:var(--serif);font-size:19px;font-weight:700;display:flex;justify-content:space-between;gap:10px;align-items:center}
.band span:first-child{font-family:var(--sans);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.mas{padding:16px 16px 4px}
.mas+.mas{border-top:1px solid var(--line)}
.mas .meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);letter-spacing:.02em}
.mas .meta .sd{font-family:var(--serif);direction:rtl;font-size:15px;color:var(--accent);font-weight:700}
.mtitle{font-family:var(--serif);font-size:calc(38px * var(--rs));line-height:1.1;font-weight:700;text-align:right;direction:rtl;margin:6px 0 0}
.msub{text-align:right;color:var(--muted);font-size:15px;margin-top:2px}
.perek{padding:12px 0 10px;border-top:1px dashed var(--line)}
.mas .perek:first-of-type{margin-top:10px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.pname{font-family:var(--serif);font-size:calc(21px * var(--rs));font-weight:700}
.sef{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:700;text-decoration:none;color:var(--gold);padding:6px 10px;border-radius:99px;background:var(--gold-soft)}
.sef svg{width:14px;height:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;direction:rtl}
.mc{min-width:44px;height:44px;padding:0 6px;border-radius:12px;border:1.5px solid var(--line2);background:var(--surface);font-family:var(--serif);font-size:calc(19px * var(--rs));font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;transition:background .12s ease,transform .08s ease}
.mc:active{transform:scale(.94)}
.mc.on{background:var(--done);border-color:var(--done);color:#fff}
.mc[disabled]{opacity:1;cursor:default}
.lfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);background:var(--surface2)}
.lfoot b{color:var(--ink)}
.lfoot .mp{flex:1;max-width:170px}
.lfoot .mp .t{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:-4px 0 10px}
.empty{padding:22px 16px;color:var(--muted);text-align:center}

/* day off card */
.offcard{margin:14px 0 12px;padding:20px 18px;border:1px dashed var(--line2);border-radius:18px;
  background:repeating-linear-gradient(135deg,transparent 0 10px,color-mix(in srgb,var(--off2) 28%,transparent) 10px 20px),var(--surface)}
.offcard .t{font-family:var(--serif);font-size:30px;font-weight:700}
.offcard p{margin:6px 0 0;color:var(--muted);font-size:15px}

/* actions */
.acts{display:grid;gap:10px;margin:0 0 6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mins{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 8px 14px;flex-wrap:wrap}
.two .btn{white-space:nowrap;font-size:15px;padding:12px 8px}
.mins .lbl{font-weight:600}
.step{display:flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-size:20px;line-height:1;flex:none}
.step input{width:58px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:8px 4px;background:var(--surface2)}
.step .timer{width:auto;min-width:44px;min-height:40px;height:40px;padding:0 10px;border-radius:12px;font-size:15px;margin-left:4px;color:var(--accent)}
.step .timer svg{width:20px;height:20px}
.step .timer.run{background:var(--accent);border-color:var(--accent);color:#fff;font-variant-numeric:tabular-nums}

/* status */
.status{border-radius:18px;padding:14px 16px;margin:14px 0 0;border:1px solid transparent}
.status .h{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.status .h svg{width:20px;height:20px}
.status p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.status.ok{background:var(--accent-soft);border-color:color-mix(in srgb,var(--done) 30%,transparent)}
.status.ok .h{color:var(--done)}
.status.behind{background:color-mix(in srgb,var(--missed) 12%,var(--surface));border-color:color-mix(in srgb,var(--missed) 30%,transparent)}
.status.behind .h{color:var(--missed)}
.status.wait{background:var(--surface);border-color:var(--line)}
.status .btn{margin-top:12px;color:var(--ink)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.fact{padding:12px 14px}
.fact .k{font-size:13px;color:var(--muted)}
.fact .v{font-size:22px;font-weight:700;line-height:1.2;margin-top:2px}
.fact .s{font-size:13px;color:var(--muted)}
.fact.full{grid-column:1/-1}
.fact .v.he{font-family:var(--serif);font-size:25px}
.fact .bar{margin-top:8px}
.next .row{font-size:15px}
.remind{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;margin:12px 0;font-size:14px}
.remind .btn{white-space:nowrap;flex:none;min-height:44px}
.offlink{text-align:center;margin:6px 0 0}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 10px}
.calhead .mid{text-align:center}
.calhead .mid .hm{font-size:13px;color:var(--gold)}
.calhead button.nav{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px}
.caltools{display:flex;justify-content:center;margin:-4px 0 10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:15px;white-space:nowrap;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;touch-action:pan-y}
.dow{text-align:center;font-size:12px;color:var(--muted);padding-bottom:2px;font-weight:600}
.dow.sh{color:var(--gold)}
.cell{aspect-ratio:1/1.08;border-radius:10px;border:0;background:var(--future);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:16px;position:relative;padding:0;font-weight:600}
.cell small{font-size:10px;font-weight:400;opacity:.8;line-height:1}
.cell.out{background:transparent;color:var(--faint);font-weight:400}
.cell.done{background:var(--done);color:#fff}
.cell.partial{background:var(--partial);color:#fff}
.cell.missed{background:var(--missed);color:#fff}
.cell.late{background:var(--late)}
.cell.off{background:repeating-linear-gradient(135deg,var(--off1) 0 4px,var(--off2) 4px 8px);color:var(--muted)}
.cell.today{outline:2.5px solid var(--ink);outline-offset:-2.5px}
.cell .dot{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.cell.done .dot,.cell.partial .dot,.cell.missed .dot{background:#fff}
.cell.sh:not(.out){box-shadow:inset 0 -3px 0 color-mix(in srgb,var(--gold) 55%,transparent)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:14px 2px 4px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.legend i.lg-off{background:repeating-linear-gradient(135deg,var(--off1) 0 3px,var(--off2) 3px 6px)}

/* siyumim */
.filters{display:flex;gap:8px;margin:12px 0 2px;overflow-x:auto;padding-bottom:4px}
.mh{font-family:var(--serif);font-size:19px;margin:20px 2px 8px;color:var(--muted)}
.sylist{overflow:hidden}
.sy{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:center}
.sy:last-child{border-bottom:0}
.sy .en2{font-size:15px;font-weight:700}
.sy .en2 .muted{font-weight:400}
.sy .nm{font-family:var(--serif);font-size:20px;font-weight:700;text-align:right;direction:rtl;grid-row:1/3;grid-column:2}
.sy .bar{grid-column:1/-1;margin-top:6px}
.sy.major .nm{color:var(--gold)}
.sy.made .nm{opacity:.75}
.sy .ok{color:var(--done);font-weight:700}
.sy .late2{color:var(--missed)}
.sy.nextone{background:var(--gold-soft)}
.more{margin:12px 0 0}

/* progress */
.ringwrap{display:flex;align-items:center;gap:18px;padding:16px}
.ring{width:118px;height:118px;flex:none}
.ring .pct{font-size:24px;font-weight:700;fill:var(--ink)}
.ring .sub{font-size:11px;fill:var(--muted)}
.ringwrap .stats{display:grid;gap:6px;font-size:15px}
.ringwrap .stats b{font-size:18px}
.shelf{display:flex;align-items:flex-end;gap:8px;padding:16px 12px 0;border-bottom:10px solid var(--shelf);border-radius:2px;margin:6px 0 2px;min-height:200px}
.spine{flex:1;position:relative;border-radius:5px 5px 2px 2px;overflow:hidden;border:0;padding:0;display:flex;align-items:center;justify-content:center;color:#E9D7A6;
  box-shadow:inset -3px 0 0 rgba(0,0,0,.25),inset 3px 0 0 rgba(255,255,255,.06)}
.spine .foil{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,var(--foil1),var(--foil2));opacity:.92;transition:height .4s ease}
.spine .lbl{position:relative;writing-mode:vertical-rl;font-family:var(--serif);font-size:18px;font-weight:700;letter-spacing:1px;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.spine .bands{position:absolute;left:0;right:0;top:10px;height:5px;border-top:1px solid rgba(233,215,166,.55);border-bottom:1px solid rgba(233,215,166,.55)}
.spine.sel{outline:2.5px solid var(--gold);outline-offset:2px}
.shelfcap{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:4px 2px 12px}
.unit{padding:12px 0;border-bottom:1px solid var(--line)}
.unit:last-child{border-bottom:0}
.unit .u1{display:flex;justify-content:space-between;gap:10px;font-size:15px;align-items:baseline}
.unit .u1 .he{font-size:19px;font-weight:700}
.pmap{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;direction:rtl}
.pmap i{width:16px;height:16px;border-radius:4px;background:var(--surface2);border:1px solid var(--line2)}
.pmap i.p{background:color-mix(in srgb,var(--gold) 45%,var(--surface2));border-color:var(--gold)}
.pmap i.f{background:var(--gold);border-color:var(--gold)}
.chart{padding:12px 12px 6px;margin:0 0 12px}
.chart svg{width:100%;height:auto;display:block}

/* settings */
.field{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label{font-size:16px}
.field .fh{grid-column:1/-1;font-size:13px;color:var(--muted);margin-top:-4px}
.field input:not([type=checkbox]),.field select{width:150px;text-align:right;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--surface2);min-height:42px}
.field input[type=text]{width:100%;grid-column:1/-1;text-align:right;direction:rtl}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface2)}
.seg button{border:0;background:none;padding:8px 12px;font-weight:600;font-size:15px;min-width:44px}
.seg button.on{background:var(--ink);color:var(--bg)}
.switch{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:99px;background:var(--line2);position:relative;transition:background .15s;margin:0;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.switch:checked{background:var(--done)}
.switch:checked::after{left:23px}
.preview{padding:12px 16px;font-size:15px}
.preview b{font-weight:700}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px;font:16px/1.4 var(--sans);color:var(--ink)}
.note{font-size:14px;color:var(--muted)}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
  background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);
  border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;background:none;border:0;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:25px;height:25px}
nav.tabs button.on{color:var(--gold)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,8,9,.45);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--bg);border-radius:22px 22px 0 0;max-height:90vh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;

.sheet.on{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line2);margin:4px auto 10px}
.sheet .inner{max-width:560px;margin:0 auto}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.shead .date{font-family:var(--serif);font-size:24px;line-height:1.2}
.closex{background:var(--surface2);border:1px solid var(--line);border-radius:99px;font-size:15px;font-weight:700;color:var(--muted);padding:6px 14px;min-height:36px}
.welcome{text-align:center;padding:8px 4px 0}
.welcome .mark{font-family:var(--serif);font-size:46px;font-weight:700;color:var(--gold);line-height:1}
.welcome h2{font-family:var(--serif);font-size:30px;margin:10px 0 6px}
.welcome p{color:var(--muted);margin:0 auto 14px;max-width:420px}
.welcome .card{text-align:left}
.choice{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);text-align:left}
.choice:last-child{border-bottom:0}
.choice input{margin-top:4px;width:20px;height:20px;accent-color:var(--gold)}
.choice small{display:block;color:var(--muted)}

/* celebrate + toast */
.celebrate{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(10,8,9,.6)}
.celebrate.on{display:flex}
.celebrate .box{background:var(--surface);border:1px solid var(--gold);border-radius:22px;padding:28px 22px 20px;text-align:center;max-width:420px;width:100%}
.celebrate .hadran{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--gold);direction:rtl;line-height:1.35}
.celebrate p{margin:10px 0 18px;color:var(--muted)}
.celebrate .two{margin-top:8px}
.foilbit{position:fixed;top:-20px;width:9px;height:14px;z-index:41;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:var(--ink);color:var(--bg);
  padding:11px 16px;border-radius:14px;font-size:15px;z-index:50;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;
  max-width:calc(100% - 32px);width:max-content;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.toast .undo{background:none;border:0;padding:0 0 0 14px;font-weight:700;color:inherit;text-decoration:underline;text-underline-offset:3px}
@media (prefers-reduced-motion: reduce){.sheet,.scrim,.toast,.spine .foil{transition:none}.screen.on{animation:none}.foilbit{display:none}}

/* Each plan day has a weight (weekday 1, Shabbat = the Shabbat setting). The year's mishnayot are spread by weight.

    <p>${hadOld ? "Limud is now one clear goal: all 63 masechtot of Mishnah in a year. The Rambam is gone." : "All 63 masechtot, 4,192 mishnayot, spread over your year: a little every weekday and more on Shabbat."}</p>
    ${hadOld ? `<div class="card pad" style="margin-bottom:12px">
      <label class="choice"><input type="radio" name="wk" value="keep" ${wz.keep ? "checked" : ""}><span><b>Keep my progress</b><small>${plural(nLogged, "logged day")} and your start date (${fullDate(parseDN(S.settings.start))}) stay. Mishnayot you already marked learned are kept.</small></span></label>
      <label class="choice"><input type="radio" name="wk" value="fresh" ${wz.keep ? "" : "checked"}><span><b>Start fresh</b><small>Clears the old log and starts a new plan.</small></span></label></div>` : ""}
    <div class="card pad">
      ${wz.keep ? "" : `<div class="field"><label for="w-start">Start date</label><input id="w-start" type="date" value="${wz.start}"></div>`}
      <div class="field"><label for="w-shab">Shabbat</label><select id="w-shab">${shOpts.map(v => `<option value="${v}" ${+wz.shab === v ? "selected" : ""}>${v === 0 ? "No learning" : v === 1 ? "Same as a weekday" : v + "× a weekday"}</option>`).join("")}</select></div>
    </div>
    <div class="card preview" style="margin-top:10px"><div class="row"><span>Weekdays</span><b>about ${Math.round(sh.wkAmt)} mishnayot</b></div><div class="row"><span>Shabbat</span><b>${st.shab ? `about ${Math.round(sh.shAmt)} mishnayot` : "Off"}</b></div><div class="row"><span>Finish</span><b>${fullDate(sh.end)}</b></div></div>
    <button class="btn primary big wide" id="w-go" style="margin-top:14px">${hadOld && wz.keep ? "Continue" : "Start my year"}</button>
    <p class="note">You can change all of this later in Settings.</p></div>`, {k: "welcome"});
}
function finishWelcome(){
  if (!(hadOld && wz.keep)){ if (hadOld) S.log = {}; S.settings.start = wz.start; S.timer = null; }
  S.settings.shab = +wz.shab; S.onboarded = true; hadOld = false; wz = null;
  save(); computePlan(); calMonth = null; sheet = null; $("#scrim").classList.remove("on"); $("#sheet").classList.remove("on"); render(); toast("Your plan is ready. Behatzlachah!");
}
function celebrate(evs){
  const lines = evs.map(e => e.t === "Masechet" ? `הדרן עלך מסכת ${e.he.replace("מסכת ", "")}` : e.t === "Seder" ? `הדרן עלך ${e.he}` : "הדרן עלך ששה סדרי משנה");
  const text = `I just finished ${evs.map(e => e.t === "Shas" ? "all of Shas Mishnah" : e.n.startsWith("Seder") ? e.n : "Masechet " + e.n).join(" and ")}!`;
  $("#celebrateBox").innerHTML = `<div class="hadran">${lines.map(esc).join("<br>")}</div><p>${esc(evs.map(e => e.n).join(", "))} complete. Mazal tov!</p>
    <div class="two"><button class="btn" data-share="${esc(text)}">Share</button><button class="btn primary" data-close-cel>Close</button></div>`;
  $("#celebrate").classList.add("on");
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches){
    for (let i = 0; i < 46; i++){ const b = document.createElement("span"); b.className = "foilbit";
      b.style.left = Math.random() * 100 + "vw"; b.style.background = ["#E8CB7E","#C9A44C","#F5E2AE","#B88A2E"][i % 4];
      b.style.animationDuration = (1.6 + Math.random() * 1.4) + "s"; b.style.animationDelay = Math.random() * .5 + "s";
      document.body.appendChild(b); setTimeout(() => b.remove(), 3800); }
  }
}

/* ---------- changes ---------- */
function refresh(){ render(); if (sheet && sheet.k === "day") openDay(sheet.n); else if (sheet && sheet.k === "off") openOffPanel(); }
/* Every change to the log goes through here: it saves, re-plans, celebrates new siyumim and offers Undo. */
function change(mutate, msg){
  const snap = JSON.stringify(S.log), before = progress().evDone;
  const r = mutate(); if (r === false) return;
  save(); computePlan();
  const after = progress().evDone, fresh = P.events.filter(e => after[e.i] && !before[e.i]);
  refresh();
  if (fresh.length) celebrate(fresh);
  toast(msg(r), () => { S.log = JSON.parse(snap); save(); computePlan(); refresh(); toast("Undone"); });
}
const lockOf = d => ({m: d.mr.map(r => r.slice())});
function toggleDone(iso){
  const d = dayAt(iso); if (!d || d.off || !d.mc) return;
  const was = stat(d) === "done";
  change(() => { const e = S.log[iso] || {}; delete e.t; if (was){ delete e.s; delete e.k; } else { e.s = "done"; e.k = lockOf(d); } S.log[iso] = e; tidy(iso); },
    () => was ? "Marked not learned" : `Learned ${mish(d.mc)}. Yasher koach!`);
}
function toggleTick(iso, x){
  const d = dayAt(iso); if (!d || d.off || P.mDay[x] !== d.n) return;
  const tk = ticksOf(d); if (tk.has(x)) tk.delete(x); else tk.add(x);
  const all = tk.size === d.mc;
  change(() => { const e = S.log[iso] || {};
      if (all){ e.s = "done"; delete e.t; e.k = lockOf(d); }
      else { if (e.s === "done" || e.s === "missed" || e.s === "partial") delete e.s; e.t = [...tk].sort((a, b) => a - b); if (e.t.length){ if (!e.k) e.k = lockOf(d); } else delete e.k; }
      S.log[iso] = e; tidy(iso); },
    () => all ? `All ${mish(d.mc)} learned. Yasher koach!` : `${tk.size} of ${d.mc} learned`);
}
function toggleMissed(iso){
  const d = dayAt(iso); if (!d || d.off) return;
  const was = stat(d) === "missed";
  change(() => { const e = S.log[iso] || {}; delete e.t; delete e.k; if (was) delete e.s; else e.s = "missed"; S.log[iso] = e; tidy(iso); },
    () => was ? "Cleared" : "Marked missed. It stays on your list to catch up.");
}
function makeOff(iso){ const e = S.log[iso] || {}; if (e.s === "done" || e.s === "off") return false; e.s = "off"; delete e.k; delete e.t; S.log[iso] = e; return true; }
function unOff(iso){ const e = S.log[iso]; if (!e || e.s !== "off") return false; delete e.s; tidy(iso); return true; }
function toggleSkip(iso){
  const s = (S.log[iso] || {}).s; if (s === "done") return;
  const wasOff = s === "off", isT = iso === isoOf(todayDN());
  change(() => wasOff ? unOff(iso) : makeOff(iso),
    () => wasOff ? `Day off removed. Plan ends ${fullDate(P.end)}.` : `${isT ? "Pushed to tomorrow" : "Day off added"}. Plan now ends ${fullDate(P.end)}.`);
}
function addOffRange(){
  const fv = $("#o-from").value, tv = $("#o-to").value;
  if (!isoRe.test(fv) || !isoRe.test(tv)){ toast("Pick a from and to date"); return; }
  let a = parseDN(fv), b = parseDN(tv); if (a > b) [a, b] = [b, a];
  a = Math.max(a, P.s0);
  if (b < a){ toast("Pick dates on or after your start date"); return; }
  if (b - a > 730){ toast("Pick a range of two years or less"); return; }
  let kept = 0, already = 0;
  change(() => { let n = 0; for (let dn = a; dn <= b; dn++){ const iso = isoOf(dn), s = (S.log[iso] || {}).s; if (s === "done") kept++; else if (s === "off") already++; else if (makeOff(iso)) n++; }
      if (!n){ toast(kept && !already ? "Those days are already learned" : "Those days are already off"); return false; } offFrom = offTo = ""; return n; },
    n => `${plural(n, "day")} off added${kept ? `, ${kept} learned ${kept === 1 ? "day" : "days"} kept` : ""}. Plan now ends ${fullDate(P.end)}.`);
}
function removeOffRange(a, b){ change(() => { let n = 0; for (let dn = a; dn <= b; dn++) if (unOff(isoOf(dn))) n++; return n || false; }, n => `${plural(n, "day")} off removed. Plan ends ${fullDate(P.end)}.`); }
function catchUp(){
  const tday = todayDN() - P.s0 + 1;
  change(() => { let n = 0; for (const d of P.days){ if (d.n >= tday) break; const s = stat(d); if ((!s || s === "missed") && makeOff(d.iso)) n++; } return n || false; },
    n => `${plural(n, "past day")} turned into days off. Plan now ends ${fullDate(P.end)}.`);
}
function setMins(iso, v){ const e = S.log[iso] || {}, m = clamp(Math.round(+v || 0), 0, 900); if (m) e.m = m; else delete e.m; S.log[iso] = e; tidy(iso); save(); }
/* timer */
let tick = null;
function timerText(){ if (!S.timer) return ""; const s = Math.max(0, Math.floor((Date.now() - S.timer.t0) / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
function syncTimer(){ clearInterval(tick); if (S.timer) tick = setInterval(() => { const el = document.getElementById("timerTxt"); if (el) el.textContent = timerText(); }, 1000); }
function toggleTimer(iso){
  if (S.timer && S.timer.iso === iso){ const add = Math.max(1, Math.round((Date.now() - S.timer.t0) / 60000)), e = S.log[iso] || {}; e.m = clamp((+e.m || 0) + add, 0, 900); S.log[iso] = e; S.timer = null; save(); syncTimer(); refresh(); toast(`Added ${add} min`); return; }
  if (S.timer){ toast("Stop the other timer first"); return; }
  S.timer = {iso, t0: Date.now()}; save(); syncTimer(); refresh();
}
/* theme */
function applyTheme(){
  const t = S.settings.theme, root = document.documentElement;
  if (t === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", t);
  root.style.setProperty("--rs", S.settings.rs);
  const dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => { m.setAttribute("content", dark ? "#1A1416" : "#F3F1EA"); });
}
/* backup */
function backup(){
  S.settings.lastBackup = isoOf(todayDN()); save();
  const blob = new Blob([JSON.stringify(S)], {type: "application/json"}), a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `limud-backup-${isoOf(todayDN())}.json`; document.body.appendChild(a); a.click(); a.remove();
  render(); toast("Backup saved");
}
function restore(txt){
  try { const p = JSON.parse(txt); if (!p || typeof p !== "object" || !p.log || typeof p.log !== "object") throw 0;
    S = migrate(p); S.onboarded = true; save(); applyTheme(); computePlan(); syncTimer(); calMonth = null; render(); toast("Backup restored"); }
  catch (e){ toast("That isn't a Limud backup"); }
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const ds = b.dataset;
  if (b.hasAttribute("data-undo")){ const f = undoFn; undoFn = null; $("#toast").classList.remove("on"); if (f) f(); return; }
  if (ds.tab){ go(ds.tab); return; }
  if (ds.tick){ toggleTick(ds.d, +ds.tick); return; }
  if (ds.done){ toggleDone(ds.done); return; }
  if (ds.missed){ toggleMissed(ds.missed); return; }
  if (ds.skip){ toggleSkip(ds.skip); return; }
  if (ds.timer){ toggleTimer(ds.timer); return; }
  if (ds.min){ const iso = ds.d, cur = +(S.log[iso] && S.log[iso].m) || 0; setMins(iso, cur + +ds.min); refresh(); return; }
  if (b.hasAttribute("data-offpanel")){ offFrom = offTo = ""; openOffPanel(); return; }
  if (ds.unoff){ const [a, c] = ds.unoff.split("|").map(Number); removeOffRange(a, c); return; }
  if (b.hasAttribute("data-catchup")){ catchUp(); return; }
  if (b.id === "o-add"){ addOffRange(); return; }
  if (ds.day){ openDay(+ds.day); return; }
  if (ds.cal){ if (ds.cal === "today") calMonth = null; else { let [y, m] = calMonth; m += +ds.cal; if (m < 0){ m = 11; y--; } if (m > 11){ m = 0; y++; } calMonth = [y, m]; } render(); return; }
  if (ds.filter){ syFilter = ds.filter; render(); return; }
  if (b.hasAttribute("data-syall")){ syAll = true; render(); return; }
  if (ds.spine){ shelfSel = shelfSel === +ds.spine ? null : +ds.spine; render(); return; }
  if (ds.usepace){ S.settings.minM = +ds.usepace; save(); render(); toast(`Estimates now use ${ds.usepace} min per mishnah`); return; }
  if (ds.rs){ S.settings.rs = +ds.rs; save(); applyTheme(); render(); return; }
  if (ds.themeSet){ S.settings.theme = ds.themeSet; save(); applyTheme(); render(); return; }
  if (b.hasAttribute("data-close")){ closeSheet(); return; }
  if (b.hasAttribute("data-close-cel")){ $("#celebrate").classList.remove("on"); return; }
  if (ds.share){ const t = ds.share; if (navigator.share) navigator.share({text: t}).catch(() => {}); else navigator.clipboard.writeText(t).then(() => toast("Copied"), () => {}); return; }
  if (b.hasAttribute("data-backup")){ backup(); return; }
  if (b.id === "w-go"){ finishWelcome(); return; }
  if (b.id === "b-copy"){ const t = JSON.stringify(S); navigator.clipboard.writeText(t).then(() => { S.settings.lastBackup = isoOf(todayDN()); save(); render(); toast("Backup copied"); }, () => { $("#b-text").value = t; toast("Copy the text in the box"); }); return; }
  if (b.id === "b-import"){ restore($("#b-text").value); return; }
  if (b.id === "b-file"){ $("#b-filein").click(); return; }
  if (b.id === "b-reset"){ if (confirm("Clear every logged day and day off? Settings stay.")){ const snap = JSON.stringify(S.log); S.log = {}; S.timer = null; save(); computePlan(); syncTimer(); render(); toast("Progress cleared", () => { S.log = JSON.parse(snap); save(); computePlan(); render(); toast("Undone"); }); } return; }
});
$("#scrim").addEventListener("click", closeSheet);
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "o-from"){ offFrom = el.value; if (!offTo || offTo < offFrom){ offTo = offFrom; const t = $("#o-to"); if (t) t.value = offFrom; } return; }
  if (el.id === "o-to"){ offTo = el.value; return; }
  if (el.name === "wk"){ wz.keep = el.value === "keep"; openWelcome(); return; }
  if (el.id === "w-start"){ if (isoRe.test(el.value)) wz.start = el.value; openWelcome(); return; }
  if (el.id === "w-shab"){ wz.shab = +el.value; openWelcome(); return; }
  if (el.dataset.mins){ setMins(el.dataset.mins, el.value); refresh(); return; }
  if (el.dataset.set){
    const k = el.dataset.set; let v = el.type === "checkbox" ? el.checked : el.value;
    if (k === "start"){ if (!isoRe.test(v)){ render(); return; } const delta = parseDN(v) - parseDN(S.settings.start); if (delta) shiftLog(delta); }
    else if (k === "minM" || k === "months" || k === "shab"){ v = +v; const [lo, hi] = LIM[k]; if (!(v >= lo && v <= hi)){ toast(`Enter ${lo} to ${hi}`); render(); return; } }
    S.settings[k] = v; save(); computePlan(); calMonth = null; render(); toast("Saved");
  }
  if (el.id === "b-filein" && el.files[0]){ el.files[0].text().then(restore); }
});
/* swipe between months */
let sx = null, sy0 = null;
document.addEventListener("touchstart", e => { if (tab !== "calendar" || !e.target.closest("#calgrid")) { sx = null; return; } sx = e.touches[0].clientX; sy0 = e.touches[0].clientY; }, {passive: true});
document.addEventListener("touchend", e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy0; sx = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5){ let [y, m] = calMonth; m += dx < 0 ? 1 : -1; if (m < 0){ m = 11; y--; } if (m > 11){ m = 0; y++; } calMonth = [y, m]; render(); } }, {passive: true});
document.addEventListener("keydown", e => { if (e.key === "Escape"){ closeSheet(); $("#celebrate").classList.remove("on"); } });
let lastDay = todayDN();
function dayCheck(){ if (todayDN() !== lastDay){ lastDay = todayDN(); calMonth = null; } }
document.addEventListener("visibilitychange", () => { if (!document.hidden){ dayCheck(); refresh(); } });
setInterval(() => { if (todayDN() !== lastDay){ dayCheck(); refresh(); } }, 60000);
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", applyTheme);

applyTheme(); computePlan(); render(); syncTimer();
if (!S.onboarded) openWelcome();
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
