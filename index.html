<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Limud">
<meta name="theme-color" content="#ECEEE9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1416" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Limud: Mishnah and Rambam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light dark;
  --bg:#ECEEE9; --surface:#FFFFFF; --surface2:#F4F5F1; --line:#D8DBD2;
  --ink:#1E1A1C; --muted:#696366; --gold:#A47A1F; --gold-soft:#F3E7C6; --on-gold:#FFFFFF;
  --mishnah:#2E7454; --rambam:#3C5398; --done:#3E8E62; --partial:#C48A1C; --missed:#B9483F;
  --late:#E9CFCB; --ahead:#E3E6DE; --shadow:0 1px 0 rgba(30,26,28,.06);
  --spine-m1:#23402F; --spine-m2:#2D5039; --spine-r1:#1F2C52; --spine-r2:#2A3866; --spine-i:#4A1F27; --shelf:#B9A57C;
  --serif:"Frank Ruhl Libre","Times New Roman",Georgia,serif;
  --sans:"Assistant",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1A1416; --surface:#241C1F; --surface2:#2D2427; --line:#3B3034;
    --ink:#F1EADF; --muted:#A99D96; --gold:#D6B160; --gold-soft:#3A2F1E; --on-gold:#1A1416;
    --mishnah:#6DB088; --rambam:#8EA2E0; --done:#5FA37C; --partial:#D9A441; --missed:#D0675D;
    --late:#4A2E2E; --ahead:#2D2427; --shadow:none; --shelf:#5A4632;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:17px;line-height:1.45;min-height:100vh;
  padding:env(safe-area-inset-top,0px) 0 calc(76px + env(safe-area-inset-bottom,0px));}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:12px 18px 24px}
.screen{display:none}
.screen.on{display:block}
.he{font-family:var(--serif);direction:rtl;unicode-bidi:isolate}
.muted{color:var(--muted)}
a{color:inherit}
h1,h2,h3{margin:0;font-weight:700}
h2{font-family:var(--serif);font-size:26px;letter-spacing:.2px}
h3{font-size:17px}
.small{font-size:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:6px 0 2px}
.top .day{font-size:15px;color:var(--muted);white-space:nowrap}
.date{font-family:var(--serif);font-size:24px}
.ded{color:var(--gold);font-size:18px;margin-top:2px;text-align:right}
/* learning sheet */
.leaf{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin:16px 0 12px;overflow:hidden;box-shadow:var(--shadow)}
.part{padding:16px 18px 14px;text-align:right}
.part+.part{border-top:1px solid var(--line)}
.kind{font-family:var(--serif);font-size:16px;font-weight:700}
.kind.m{color:var(--mishnah)} .kind.r{color:var(--rambam)}
.title{font-family:var(--serif);font-size:34px;line-height:1.15;font-weight:700;margin:2px 0}
.title.sm{font-size:24px}
.ref{font-family:var(--serif);font-size:20px}
.en{direction:ltr;text-align:right;color:var(--muted);font-size:15px;margin-top:4px}
.open{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:15px;font-weight:600;text-decoration:none;
  padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface2)}
.parts-line{margin-top:10px}
.siyum-band{background:var(--gold-soft);color:var(--gold);padding:12px 18px;text-align:right;font-family:var(--serif);font-size:20px;font-weight:700}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:12px 18px;border-top:1px solid var(--line);font-size:15px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
/* actions */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px;font-weight:600;font-size:16px}
.btn.primary{grid-column:1/-1;background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-size:18px;padding:15px}
.btn.sel-done{background:var(--done);border-color:var(--done);color:#fff}
.btn.sel-partial{background:var(--partial);border-color:var(--partial);color:#fff}
.btn.sel-missed{background:var(--missed);border-color:var(--missed);color:#fff}
.mins{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px 8px 16px;margin-bottom:6px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-size:20px;line-height:1}
.step input{width:64px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:8px 4px;background:var(--surface2)}
/* status line */
.status{border-radius:14px;padding:12px 16px;margin:14px 0 6px;font-weight:600}
.status.ok{background:color-mix(in srgb,var(--done) 16%,transparent);color:var(--done)}
.status.behind{background:color-mix(in srgb,var(--missed) 15%,transparent);color:var(--missed)}
.status.wait{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.status small{display:block;font-weight:400;color:var(--muted);margin-top:2px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.fact .k{font-size:14px;color:var(--muted)}
.fact .v{font-size:22px;font-weight:700;line-height:1.2;margin-top:2px}
.fact .s{font-size:14px;color:var(--muted)}
.fact.siyum{grid-column:1/-1}
.fact.siyum .v{font-family:var(--serif);font-size:24px}
.next{margin-top:18px}
.next h3{margin-bottom:6px}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.linkish{background:none;border:0;padding:0;color:var(--gold);font-weight:600;text-decoration:underline;text-underline-offset:3px}
/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin:8px 0 12px}
.calhead button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{text-align:center;font-size:13px;color:var(--muted);padding-bottom:2px}
.dow.sh{color:var(--gold)}
.cell{aspect-ratio:1/1.05;border-radius:10px;border:0;background:var(--ahead);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;position:relative;padding:0}
.cell.out{background:transparent;color:var(--muted);opacity:.35}
.cell.done{background:var(--done);color:#fff;font-weight:700}
.cell.partial{background:var(--partial);color:#fff;font-weight:700}
.cell.missed{background:var(--missed);color:#fff;font-weight:700}
.cell.late{background:var(--late)}
.cell.today{outline:2px solid var(--ink);outline-offset:-2px;font-weight:700}
.cell .dot{position:absolute;bottom:5px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.cell.done .dot,.cell.partial .dot,.cell.missed .dot{background:#fff}
.cell.sh{box-shadow:inset 0 -3px 0 color-mix(in srgb,var(--gold) 55%,transparent)}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin:14px 0 4px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.monthsum{margin-top:14px}
/* siyumim */
.mh{font-family:var(--serif);font-size:20px;margin:20px 0 6px;color:var(--muted)}
.sy{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px}
.sy .nm{font-family:var(--serif);font-size:21px;font-weight:700;text-align:right;grid-column:1/-1;direction:rtl}
.sy .en2{font-size:15px}
.sy .when{font-size:15px;color:var(--muted);text-align:right;white-space:nowrap}
.sy.major{border-color:color-mix(in srgb,var(--gold) 60%,var(--line))}
.sy.major .nm{color:var(--gold)}
.sy.done{opacity:.6}
.sy.done .when{color:var(--done);font-weight:600}
.sy.nextone{background:var(--gold-soft);border-color:var(--gold)}
.filters{display:flex;gap:8px;margin:10px 0 2px;overflow-x:auto}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:15px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* shelf */
.shelf{display:flex;align-items:flex-end;gap:6px;padding:14px 10px 0;border-bottom:10px solid var(--shelf);border-radius:2px;margin:6px 0 2px;min-height:210px}
.spine{flex:1;position:relative;border-radius:4px 4px 2px 2px;overflow:hidden;border:0;padding:0;
  display:flex;align-items:center;justify-content:center;color:#E9D7A6;box-shadow:inset -3px 0 0 rgba(0,0,0,.25), inset 3px 0 0 rgba(255,255,255,.06)}
.spine .foil{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#E8CB7E,#B88A2E);opacity:.92}
.spine .lbl{position:relative;writing-mode:vertical-rl;font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:1px;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.spine .bands{position:absolute;left:0;right:0;top:10px;height:5px;border-top:1px solid rgba(233,215,166,.55);border-bottom:1px solid rgba(233,215,166,.55)}
.spine.sel{outline:2px solid var(--gold);outline-offset:2px}
.shelfcap{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:12px}
.detail{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 14px;margin:6px 0 16px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.unit{padding:10px 0;border-bottom:1px solid var(--line)}
.unit:last-child{border-bottom:0}
.unit .u1{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 6px;margin:10px 0 16px}
.chart svg{width:100%;height:auto;display:block}
.stretch{display:grid;grid-template-columns:1fr;gap:2px;padding:10px 0;border-bottom:1px solid var(--line)}
.stretch.now{background:var(--gold-soft);margin:0 -14px;padding:10px 14px;border-radius:10px}
.stretch .pair{font-size:15px}
.stretch .pair b{color:var(--mishnah)} .stretch .pair em{font-style:normal;color:var(--rambam)}
.stretch .dates{font-size:14px;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;padding:8px 0}
/* settings */
.field{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.field label{font-size:16px}
.field .hint{grid-column:1/-1;font-size:14px;color:var(--muted);margin-top:-4px}
.field input{width:150px;text-align:right;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--surface)}
.field input[type=text]{width:100%;grid-column:1/-1;text-align:right;direction:rtl}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 16px;margin:12px 0}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px;font:14px/1.4 var(--sans);color:var(--ink)}
.note{font-size:14px;color:var(--muted)}
/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
  background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;background:none;border:0;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--gold)}
/* sheet + modal */
.scrim{position:fixed;inset:0;background:rgba(10,8,9,.5);z-index:30;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--bg);border-radius:20px 20px 0 0;max-height:88vh;overflow:auto;
  padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(calc(100% + 40px));visibility:hidden;transition:transform .28s ease,visibility 0s linear .28s}
.sheet.on{transform:none;visibility:visible;transition:transform .28s ease}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet .inner{max-width:560px;margin:0 auto}
.closex{float:right;background:none;border:0;font-size:16px;color:var(--muted);padding:6px}
.celebrate{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(10,8,9,.6)}
.celebrate.on{display:flex}
.celebrate .box{background:var(--surface);border:1px solid var(--gold);border-radius:20px;padding:26px 22px;text-align:center;max-width:420px;width:100%}
.celebrate .hadran{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--gold);direction:rtl;line-height:1.3}
.celebrate p{margin:10px 0 18px;color:var(--muted)}
.foilbit{position:fixed;top:-20px;width:9px;height:14px;z-index:41;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:15px;z-index:50;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){.sheet{transition:none}.foilbit{display:none}}
@media (min-width:700px){body{font-size:17px}.title{font-size:40px}}
</style>
</head>
<body>
<div class="wrap">
  <section class="screen on" id="today" aria-label="Today"></section>
  <section class="screen" id="calendar" aria-label="Calendar"></section>
  <section class="screen" id="siyumim" aria-label="Siyumim"></section>
  <section class="screen" id="shelf" aria-label="Progress"></section>
  <section class="screen" id="settings" aria-label="Settings"></section>
</div>
<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-tab="today" class="on" aria-label="Today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5c-.8 0-1.5-.7-1.5-1.5v-13zM20 5.5c0-.8-.7-1.5-1.5-1.5H13v16h5.5c.8 0 1.5-.7 1.5-1.5v-13z"/></svg>Today</button>
  <button data-tab="calendar" aria-label="Calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Calendar</button>
  <button data-tab="siyumim" aria-label="Siyumim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8-4.3-4.1 5.9-.9z"/></svg>Siyumim</button>
  <button data-tab="shelf" aria-label="Progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4v15M9.5 6v13M14 4v15M17.2 6.5l3.3 12.3M3 20h18"/></svg>Progress</button>
  <button data-tab="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</button>
</div></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="inner" id="sheetInner"></div></div>
<div class="celebrate" id="celebrate" role="dialog" aria-modal="true"><div class="box" id="celebrateBox"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

/* ---------- plan ---------- */
let P;
function computePlan(){

  const events = D.ev.map((e, i) => {
    const day = e.k === "M" ? firstDay("mTo", e.p) : e.k === "R" ? firstDay("rTo", e.p) : Math.max(firstDay("mTo", e.p), firstDay("rTo", e.p2));
    return {...e, i, day};
  });
  const evByDay = {}; events.forEach(e => (evByDay[e.day] = evByDay[e.day] || []).push(e));
  const segDays = SEG.map(g => ({start: Math.min(firstDay("mTo", g.cm + 1), firstDay("rTo", g.cr + 1)), end: Math.max(firstDay("mTo", g.cm + g.m), firstDay("rTo", g.cr + g.r))}));
  P = {s0, pd, days, tload, events, evByDay, segDays, totMin: NM * st.minM + NR * st.minR};

}
function mParts(d){
  if (!d.mc) return [];
  const out = []; let x = d.mFrom;
  while (x <= d.mTo){
    const u = MU[chapOf(x).u], y = Math.min(d.mTo, u.last), cx = chapOf(x), cy = chapOf(y);
    const m1 = x - cx.first + 1, m2 = y - cy.first + 1, whole = m1 === 1 && y === cy.last;
    const en = whole ? `${u.n} ${cx.p}${cy.p > cx.p ? "–" + cy.p : ""}` : `${u.n} ${cx.p}:${m1}${y > x ? "–" + (cy.p === cx.p ? m2 : cy.p + ":" + m2) : ""}`;
    const he = whole ? (cy.p > cx.p ? `פרקים ${heL(cx.p)}–${heL(cy.p)}` : `פרק ${heL(cx.p)}`) : `${heL(cx.p)}:${heL(m1)}${y > x ? " – " + (cy.p === cx.p ? heL(m2) : heL(cy.p) + ":" + heL(m2)) : ""}`;
    const ref = whole ? `${cx.p}${cy.p > cx.p ? "-" + cy.p : ""}` : `${cx.p}.${m1}${y > x ? "-" + (cy.p === cx.p ? m2 : cy.p + "." + m2) : ""}`;
    out.push({u, n: y - x + 1, en, title: u.he, he, url: `https://www.sefaria.org/${encodeURIComponent(u.u)}.${ref}?lang=bi`});

}
function rParts(d){

    out.push({u, n: y - x + 1, en: `${u.n} ${c1}${c2 > c1 ? "–" + c2 : ""}`, title: u.he,

      url: `https://www.sefaria.org/${encodeURIComponent(u.u)}.${c1 + (u.o || 0)}${c2 > c1 ? "-" + (c2 + (u.o || 0)) : ""}?lang=bi`});

const est = d => d.mc * S.settings.minM + d.rc * S.settings.minR;

/* ---------- progress ---------- */
function progress(){

    const m = S.log[d.n] && +S.log[d.n].m; if (m > 0){ mins += m; logged++; if (s === "done"){ minsOnLogged += m; estOnLogged += est(d); } }
  }
  for (let n = 1; n <= P.pd + 1; n++) pre[n] = pre[n - 1] + (done[n] || 0);
  const allDone = (a, b) => pre[b] - pre[a - 1] === b - a + 1;
  const dayOfM = pos => { let lo = 0, hi = P.days.length - 1; while (lo < hi){ const mid = (lo + hi) >> 1; if (P.days[mid].mTo >= pos) hi = mid; else lo = mid + 1; } return P.days[lo].n; };

  let streak = 0; { let n = Math.min(Math.max(tday, 0), P.pd); if (n >= 1 && !done[n]) n--; while (n >= 1 && done[n]){ streak++; n--; } }
  let best = 0, run = 0; for (let n = 1; n <= P.pd; n++){ run = done[n] ? run + 1 : 0; best = Math.max(best, run); }
  const late = P.days.filter(d => d.n < tday && !st(d.n)).length;
  const proj = tday >= 1 && doneW > 0 ? P.s0 + Math.ceil(tday * TW / doneW) - 1 : null;
  const evDone = e => {
    if (e.t === "Masechet"){ const u = MU.find(u => u.n === e.n); return MCH.every((c, i) => c.u !== u.i || chDone[i]); }
    if (e.t === "Seder"){ const g = e.n.replace("Seder ", ""); return MCH.every((c, i) => MU[c.u].s !== g || chDone[i]); }
    if (e.t === "Shas") return chDone.every(Boolean);
    if (e.t === "Sefer"){ const g = e.n.replace("Sefer ", ""); return RU.every(u => u.s !== g || [...Array(u.c)].every((_, k) => rChDone[u.first + k])); }
    if (e.t === "Rambam") return rChDone.slice(1).every(Boolean);
    return MCH.every((c, i) => c.u !== 0 || chDone[i]) && [...Array(RU[0].c)].every((_, k) => rChDone[RU[0].first + k]);
  };
  const evDoneMap = P.events.map(evDone);
  return {tday, doneW, mDone, rDone, chDone, rChDone, gapW, streak, best, late, proj, mins, logged, estOnLogged, minsOnLogged, evDoneMap,
    pct: doneW / TW, perakim: chDone.filter(Boolean).length, rch: rChDone.reduce((a, b) => a + b, 0)};
}

function weekBars(){

    plan.push(p); log.push(l);
  }
  const max = Math.max(1, ...plan, ...log); let bars = "";

    if (log[k]) bars += `<rect x="${(x + bw * .2).toFixed(1)}" y="${(h - 14 - lh).toFixed(1)}" width="${Math.max(1, bw * .6 - 1).toFixed(1)}" height="${lh.toFixed(1)}" fill="var(--gold)"/>`;
  });
  return `<h3 style="margin-top:18px">Minutes each week</h3><div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Planned and logged minutes per week">${bars}</svg>

function setStatus(n, s){

  if (cur.s || cur.m) S.log[n] = cur; else delete S.log[n];
  save();
  if (cur.s === "done"){ const G = progress(); const evs = (P.evByDay[n] || []).filter(e => G.evDoneMap[e.i]); if (evs.length) celebrate(evs); else toast("Marked done"); }

}
function setMins(n, v){

document.addEventListener("click", e => {
  const b = e.target.closest("button, [data-close]"); if (!b) return;
  if (b.dataset.tab){ go(b.dataset.tab); return; }
  if (b.dataset.tabGo){ go(b.dataset.tabGo); return; }
  if (b.dataset.set){ setStatus(+b.dataset.n, b.dataset.set); return; }
  if (b.dataset.min){ const n = +b.dataset.n, cur = +(S.log[n] && S.log[n].m) || 0; setMins(n, cur + +b.dataset.min); refresh(); return; }
  if (b.dataset.day){ openSheet(+b.dataset.day); return; }
  if (b.dataset.cal){ let [y, m] = calMonth; m += +b.dataset.cal; if (m < 0){ m = 11; y--; } if (m > 11){ m = 0; y++; } calMonth = [y, m]; render(); return; }
  if (b.dataset.filter){ syFilter = b.dataset.filter; render(); return; }
  if (b.dataset.spine){ shelfSel = shelfSel === b.dataset.spine ? null : b.dataset.spine; render(); return; }
  if (b.hasAttribute("data-close")){ closeSheet(); return; }
  if (b.hasAttribute("data-close-cel")){ $("#celebrate").classList.remove("on"); return; }
  if (b.id === "b-export"){ const blob = new Blob([JSON.stringify(S)], {type: "application/json"}); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `limud-backup-${isoOf(todayDN())}.json`; document.body.appendChild(a); a.click(); a.remove(); return; }
  if (b.id === "b-copy"){ navigator.clipboard.writeText(JSON.stringify(S)).then(() => toast("Backup copied"), () => { $("#b-text").value = JSON.stringify(S); toast("Copy the text in the box"); }); return; }
  if (b.id === "b-import"){ restore($("#b-text").value); return; }
  if (b.id === "b-file"){ $("#b-filein").click(); return; }
  if (b.id === "b-reset"){ if (confirm("Clear every day you logged? Settings stay.")){ S.log = {}; save(); toast("Progress cleared"); render(); } return; }
});
$("#scrim").addEventListener("click", closeSheet);
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.mins){ setMins(+el.dataset.mins, el.value); refresh(); return; }
  if (el.dataset.setField){
    const k = el.dataset.setField; let v = el.value;
    if (k === "start"){ if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return; }
    else if (k !== "ded"){ v = +v; const lim = {months: [6, 24], wk: [0.25, 16], sh: [0, 16], minM: [0.2, 30], minR: [1, 240]}[k]; if (!(v >= lim[0] && v <= lim[1])){ toast(`Enter ${lim[0]} to ${lim[1]}`); render(); return; } if (k === "months") v = Math.round(v); }
    S.settings[k] = v; save(); computePlan(); calMonth = null; render(); toast("Saved");
  }
  if (el.id === "b-filein" && el.files[0]){ el.files[0].text().then(restore); }
});
function restore(txt){
  try { const p = JSON.parse(txt); if (!p || typeof p !== "object" || !p.log) throw 0; S = {settings: {...DEFAULTS, ...(p.settings || {})}, log: p.log}; save(); computePlan(); calMonth = null; render(); toast("Backup restored"); }
  catch (e){ toast("That isn't a Limud backup"); }
}
document.addEventListener("keydown", e => { if (e.key === "Escape"){ closeSheet(); $("#celebrate").classList.remove("on"); } });
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

computePlan(); render();
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
